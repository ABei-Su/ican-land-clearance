name: Pure core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-opencv python3-yaml
      - run: bash scripts/verify.sh
# ROS build, transport checks and Gazebo evidence require the official local runtime.
